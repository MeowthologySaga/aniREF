[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aniref"
version = "0.1.0"
description = "Game animation reference analysis and key pose composition tool"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "av>=12",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aniref-probe = "aniref.core.media.probe:main"

[project.gui-scripts]
aniref = "aniref.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
