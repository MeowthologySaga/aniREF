name: Release

# Push a tag (v0.2.0) and this builds and publishes the release; run it by hand
# from the Actions tab to check that a build still works without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # attach the zip and the installer to the GitHub Release

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller

      - name: Read the version
        id: version
        run: |
          $init = Get-Content src/aniref/__init__.py -Raw
          if ($init -notmatch '__version__\s*=\s*["'']([^"'']+)["'']') { throw "no __version__ found" }
          $version = $Matches[1]
          "version=$version" >> $env:GITHUB_OUTPUT
          # A release tag must match the version in the code, or the files people
          # download would carry a different number than the release page.
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $tag = $env:GITHUB_REF -replace "^refs/tags/", ""
            if ($tag -ne "v$version") { throw "tag $tag does not match __version__ $version (expected v$version)" }
          }
          Write-Host "aniREF $version"

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen # no screen on the runner
        run: pytest -q

      - name: Install Inno Setup
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      # Freezes the app, runs aniREF.exe --selftest on the result (installed and
      # portable), zips it and builds the installer.
      - name: Build
        run: .\packaging\build.ps1 -Python python

      - name: Check the build output
        run: |
          $files = Get-ChildItem dist -Filter "aniREF-*" -File
          $files | ForEach-Object { "{0,-44} {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }
          foreach ($pattern in @("aniREF-*-portable.zip", "aniREF-*-setup.exe")) {
            if (-not ($files | Where-Object Name -like $pattern)) { throw "missing $pattern" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: aniREF-${{ steps.version.outputs.version }}
          path: |
            dist/aniREF-*-portable.zip
            dist/aniREF-*-setup.exe
          if-no-files-found: error
          retention-days: 14

      # Logs of a failed build, so a broken bundle can be diagnosed without Windows at hand.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: |
            build/pyinstaller/aniref/warn-aniref.txt
            build/pyinstaller/aniref/xref-aniref.html
            build/selftest/**/logs/*.log
            build/portable/aniREF/data/logs/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            dist/aniREF-*-portable.zip
            dist/aniREF-*-setup.exe
